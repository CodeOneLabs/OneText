# Asks a Windows runner whether the Korean IME bug can be reproduced without
# a person at a keyboard. Two questions, cheapest first: can the runner hold
# an IME at all, and do synthesised keystrokes actually go through it. Only
# if both answer yes is it worth building a player here. Not part of the suite.
name: IME Windows probe

on:
  workflow_dispatch:
  push:
    branches: [ime/windows-runner-probe]

jobs:
  probe:
    name: What a Windows runner can do with an IME
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Can it hold an IME
        shell: powershell
        run: ./Tools/ImeCheck~/probe-runner.ps1
      - name: Do synthesised keys go through it
        shell: powershell
        run: ./Tools/ImeCheck~/probe-synthesis.ps1
