# Asks a Windows runner three questions that decide whether the Korean IME
# bug can be reproduced without a person at a keyboard:
#
#   1. Is there an interactive desktop, or is this session 0? An IME needs a
#      window station with a real message queue; without one the whole idea
#      stops here.
#   2. Can the Korean language pack and the Microsoft IME be installed?
#   3. Does the IME actually engage — does composition text appear in a
#      window when keys are synthesised?
#
# Nothing here is part of the test suite. It exists to find out whether the
# answer to "does the fix work on Windows" can be obtained by machine.
name: IME Windows probe

on:
  workflow_dispatch:
  push:
    branches: [ime/windows-runner-probe]

jobs:
  probe:
    name: What a Windows runner can do with an IME
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Session and desktop
        shell: powershell
        run: |
          Write-Host "OS: $((Get-CimInstance Win32_OperatingSystem).Caption) build $([System.Environment]::OSVersion.Version)"
          Write-Host "User: $env:USERNAME  Interactive: $([System.Environment]::UserInteractive)"
          try { query session } catch { Write-Host "query session unavailable" }
          Add-Type -AssemblyName System.Windows.Forms
          try {
            $f = New-Object System.Windows.Forms.Form
            $f.Text = "probe"; $f.Show(); Start-Sleep -Milliseconds 300
            Write-Host "WINDOW: created, handle $($f.Handle)"
            $f.Close()
          } catch { Write-Host "WINDOW: FAILED - $_" }

      - name: Installed input methods, before
        shell: powershell
        run: |
          Get-WinUserLanguageList | ForEach-Object {
            Write-Host "lang $($_.LanguageTag) tips: $($_.InputMethodTips -join ', ')"
          }

      - name: Try to install Korean
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "--- Install-Language"
          if (Get-Command Install-Language -ErrorAction SilentlyContinue) {
            try { Install-Language ko-KR -ErrorAction Continue } catch { Write-Host "Install-Language: $_" }
          } else { Write-Host "Install-Language: cmdlet not present" }

          Write-Host "--- Add-WindowsCapability"
          foreach ($cap in @("Language.Basic~~~ko-KR~0.0.1.0")) {
            try {
              $s = Get-WindowsCapability -Online -Name $cap -ErrorAction Stop
              Write-Host "$cap -> $($s.State)"
              if ($s.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap -ErrorAction Continue | Out-Null }
              Write-Host "$cap -> $((Get-WindowsCapability -Online -Name $cap).State)"
            } catch { Write-Host "$cap : $_" }
          }

      - name: Add the IME to the user language list
        shell: powershell
        continue-on-error: true
        run: |
          $list = Get-WinUserLanguageList
          if (-not ($list | Where-Object LanguageTag -eq 'ko-KR')) { $list.Add('ko-KR') }
          Set-WinUserLanguageList $list -Force
          Get-WinUserLanguageList | ForEach-Object {
            Write-Host "lang $($_.LanguageTag) tips: $($_.InputMethodTips -join ', ')"
          }
          Write-Host "--- keyboard layouts loaded in this session"
          Add-Type @"
            using System; using System.Runtime.InteropServices; using System.Text;
            public class L {
              [DllImport("user32.dll")] public static extern int GetKeyboardLayoutList(int n, [Out] IntPtr[] h);
              [DllImport("user32.dll")] public static extern IntPtr LoadKeyboardLayout(string id, uint f);
            }
"@
          $h = New-Object IntPtr[] 16
          $n = [L]::GetKeyboardLayoutList(16, $h)
          for ($i = 0; $i -lt $n; $i++) { Write-Host ("HKL {0:X8}" -f $h[$i].ToInt64()) }
          $k = [L]::LoadKeyboardLayout("00000412", 1)
          Write-Host ("LoadKeyboardLayout(ko) -> {0:X8}" -f $k.ToInt64())
