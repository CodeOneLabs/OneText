# Asks a Windows runner whether the Korean IME bug can be reproduced without
# a person at a keyboard: is there an interactive desktop, can the Korean IME
# be installed, does a keyboard layout for it load. Not part of the suite.
name: IME Windows probe

on:
  workflow_dispatch:
  push:
    branches: [ime/windows-runner-probe]

jobs:
  probe:
    name: What a Windows runner can do with an IME
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: powershell
        run: ./Tools/ImeCheck~/probe-runner.ps1
