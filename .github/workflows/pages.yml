# Publishes page/ to GitHub Pages.
#
# Not the "main branch /docs folder" setting, which would be simpler: this
# repository already has a Docs/ directory, and on a case-insensitive
# filesystem — which is every macOS checkout, including the one this is
# developed on — a docs/ folder beside it is the same folder. Publishing from
# an arbitrary directory needs a workflow, so here it is.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes a waiting one but never
# cancels a deploy that is already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: page
      - id: deploy
        uses: actions/deploy-pages@v4
