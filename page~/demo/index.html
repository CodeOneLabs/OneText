<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneText · demo</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#010409; --panel:#0d1117; --ink:#e6edf3; --dim:#8b949e; --green:#3fb950; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }

  header { display:flex; align-items:center; gap:14px; padding:10px 16px;
    border-bottom:1px solid #21262d; flex:0 0 auto; }
  header a { color:var(--dim); text-decoration:none; font-size:12px; }
  header a:hover { color:var(--ink); }
  header .name { font-weight:650; letter-spacing:-0.01em; }
  header .name i { font-style:normal; color:var(--green); }
  header .spacer { flex:1; }

  /* The player keeps 16:9 and is centred; the demo lays itself out against a
     1600x900 reference and matches on width, so letterboxing beats stretching. */
  #shell { flex:1; display:flex; align-items:center; justify-content:center;
    padding:12px; min-height:0; }
  #frame { position:relative; width:100%; max-width:1600px; aspect-ratio:16/9;
    max-height:100%; background:#000; border:1px solid #21262d; border-radius:6px;
    overflow:hidden; }
  #unity-canvas { width:100%; height:100%; display:block; background:var(--bg); }

  #loading { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:var(--bg); }
  #loading p { margin:0; color:var(--dim); font-size:12.5px; letter-spacing:0.02em; }
  #bar { width:220px; height:3px; background:#21262d; border-radius:2px; overflow:hidden; }
  #barfill { height:100%; width:0; background:var(--green); transition:width .15s linear; }

  #warn { position:absolute; left:0; right:0; bottom:0; padding:8px 12px;
    background:#161b22; color:var(--dim); font-size:12px; display:none; }

  footer { flex:0 0 auto; padding:8px 16px; color:var(--dim); font-size:11.5px;
    border-top:1px solid #21262d; }
</style>
</head>
<body>
  <header>
    <span class="name"><i>One</i>Text</span>
    <span class="spacer"></span>
    <a href="../index.html">← back to the page</a>
    <a href="https://github.com/CodeOneLabs/OneText">GitHub</a>
  </header>

  <div id="shell">
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <p id="loadingtext">loading the demo</p>
        <div id="bar"><div id="barfill"></div></div>
      </div>
      <div id="warn"></div>
    </div>
  </div>

  <footer>
    Everything on screen is drawn by OneText, including this demo's own chrome.
    Use the tabs to switch pages.
  </footer>

<script>
  var canvas = document.querySelector("#unity-canvas");
  var loading = document.querySelector("#loading");
  var loadingText = document.querySelector("#loadingtext");
  var barfill = document.querySelector("#barfill");
  var warn = document.querySelector("#warn");

  function showWarning(message) {
    warn.style.display = "block";
    warn.textContent = message;
  }

  // Bump this on every rebuild of Build/. It is not decoration.
  //
  // The loader keeps the data file in IndexedDB keyed by its URL, and asks the
  // server about it again only when the browser's own cache says it is stale —
  // which GitHub Pages, serving `cache-control: max-age=600`, does not for ten
  // minutes. The wasm is fetched `no-store` and is always the new one. So a
  // visitor who has been here before starts the new code against the previous
  // build's data, and that pairing does not fail politely: it recurses until
  // the stack gives out, before the first frame, with a wasm trace that names
  // nothing. A new URL cannot collide with an old entry, and moving
  // productVersion with it makes the loader drop what it was holding.
  var build = "20260812";

  var config = {
    dataUrl: "Build/demo.data.unityweb?b=" + build,
    frameworkUrl: "Build/demo.framework.js.unityweb?b=" + build,
    codeUrl: "Build/demo.wasm.unityweb?b=" + build,
    streamingAssetsUrl: "StreamingAssets",
    companyName: "CodeOneLabs",
    productName: "OneText",
    productVersion: build,
    showBanner: function (msg) { showWarning(msg); },
  };

  // A phone can load this, but the demo is a three-column desktop layout and
  // says so rather than rendering something unreadable and letting the visitor
  // conclude the library is what is wrong.
  if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
    showWarning("This demo is laid out for a desktop window. It will run here, but the panels will be small.");
  }

  var script = document.createElement("script");
  script.src = "Build/demo.loader.js?b=" + build;
  script.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
      barfill.style.width = (100 * progress) + "%";
      if (progress >= 1) loadingText.textContent = "starting";
    }).then(function () {
      loading.style.display = "none";
      canvas.focus();
    }).catch(function (message) {
      loadingText.textContent = "the demo failed to start";
      showWarning(String(message));
    });
  };
  script.onerror = function () {
    loadingText.textContent = "could not load the player";
  };
  document.body.appendChild(script);
</script>
</body>
</html>
